name: Build Windows desktop installer

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch: {}

# Publishing a release (for the in-app updater) needs write access.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      # Step "if:" can't see secrets directly; expose whether the key is set.
      HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      # better-sqlite3 is a native addon tied to one Node ABI; its postinstall
      # builds against whatever `node` is on PATH, so match the Node 22 we
      # bundle into the installer.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 1.3+ for --linker hoisted (see "Install workspace deps").
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            opencut-classic/apps/desktop-tauri/src-tauri -> target
            opencut-classic -> target

      # Flat node_modules: with bun's isolated (symlinked) layout, Next's
      # standalone output links into a store outside the bundle and the
      # installed app fails with "Cannot find module 'next'". This is the
      # only install step — apps/desktop-tauri is a workspace member, so its
      # Tauri CLI comes with it, and any later plain `bun install` would
      # re-link everything in the isolated layout.
      - name: Install workspace deps
        working-directory: opencut-classic
        run: bun install --linker hoisted

      # The editor's render/effects engine is Rust compiled to WASM. The
      # published opencut-wasm package lacks this fork's effect shaders
      # (colour grade, chroma key), so build it from rust/wasm and swap it
      # into node_modules before the web build bundles it.
      - name: Build effects engine (WASM)
        working-directory: opencut-classic
        shell: bash
        run: |
          rustup target add wasm32-unknown-unknown
          curl -sSfL https://github.com/rustwasm/wasm-pack/releases/download/v0.13.1/wasm-pack-v0.13.1-x86_64-pc-windows-msvc.tar.gz | tar xz
          ./wasm-pack-v0.13.1-x86_64-pc-windows-msvc/wasm-pack.exe build rust/wasm --target bundler --out-dir pkg
          node apps/desktop-tauri/scripts/use-local-wasm.mjs

      # The app serves Claude's tool list (/agent-tools.json) so the
      # extension picks up tools added in app updates without a reinstall.
      - name: Export Claude tool list into the app
        working-directory: mcp-server
        run: |
          npm ci
          npm run export-tools

      - name: Build web app (standalone output)
        working-directory: opencut-classic
        run: bun run build:web
        env:
          NODE_ENV: production
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:47821
          # Optional integrations stay unset — see apps/web/src/env/web.ts,
          # the app boots and runs fully without them.

      - name: Stage portable Node runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $index = Invoke-RestMethod -Uri "https://nodejs.org/dist/index.json"
          $latest22 = $index | Where-Object { $_.version -like "v22.*" } | Select-Object -First 1
          $nodeVersion = $latest22.version
          Write-Host "Staging portable Node $nodeVersion"
          $zipUrl = "https://nodejs.org/dist/$nodeVersion/node-$nodeVersion-win-x64.zip"
          Invoke-WebRequest -Uri $zipUrl -OutFile node.zip
          Expand-Archive -Path node.zip -DestinationPath node-extracted
          $extractedDir = Get-ChildItem node-extracted | Select-Object -First 1
          $dest = "opencut-classic/apps/desktop-tauri/src-tauri/resources/node"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item -Path "$($extractedDir.FullName)\*" -Destination $dest -Recurse -Force

      - name: Stage standalone server bundle
        working-directory: opencut-classic
        run: node apps/desktop-tauri/scripts/stage-server.mjs

      - name: Generate app icons
        working-directory: opencut-classic/apps/desktop-tauri
        run: bunx tauri icon ../web/public/icons/apple-icon-180x180.png

      # With the signing key (repository secret TAURI_SIGNING_PRIVATE_KEY)
      # the build also writes signed updater bundles (.sig) for the in-app
      # updater. Without it the installer is built exactly as before.
      - name: Build installer
        working-directory: opencut-classic/apps/desktop-tauri
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            bunx tauri build
          else
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set: building without updater signatures (no auto-update release)."
            bunx tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}'
          fi

      - name: Build Claude Desktop extension
        working-directory: mcp-server
        run: npm run pack

      - name: Locate installers
        id: artifacts
        shell: pwsh
        run: |
          $bundleDir = "opencut-classic/apps/desktop-tauri/src-tauri/target/release/bundle"
          Get-ChildItem -Path $bundleDir -Recurse -Include *.msi, *.exe | ForEach-Object {
            Write-Host "Built: $($_.FullName)"
          }
          echo "bundle_dir=$bundleDir" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: opencut-windows-installer
          path: |
            ${{ steps.artifacts.outputs.bundle_dir }}/msi/*.msi
            ${{ steps.artifacts.outputs.bundle_dir }}/nsis/*.exe
            mcp-server/opencut.mcpb
          if-no-files-found: error

      # Publishes release v<version> with the installers, the extension and
      # latest.json, which the installed app polls to offer the update.
      # Rebuilding the same version replaces the files of that release.
      - name: Publish release for the in-app updater
        if: env.HAS_KEY == 'true' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/desktop-v'))
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.artifacts.outputs.bundle_dir }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./opencut-classic/apps/desktop-tauri/src-tauri/tauri.conf.json').version")
          TAG="v$VERSION"
          EXE=$(ls "$BUNDLE"/nsis/*-setup.exe | head -1)
          MSI=$(ls "$BUNDLE"/msi/*.msi | head -1)
          BASE="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          EXE_URL="$BASE/$(basename "$EXE")" MSI_URL="$BASE/$(basename "$MSI")" \
          EXE_SIG=$(cat "$EXE.sig") MSI_SIG=$(cat "$MSI.sig") VERSION="$VERSION" \
          node -e '
            const e = process.env;
            const nsis = { signature: e.EXE_SIG, url: e.EXE_URL };
            const msi = { signature: e.MSI_SIG, url: e.MSI_URL };
            const latest = {
              version: e.VERSION,
              notes: "OpenCut " + e.VERSION,
              pub_date: new Date().toISOString(),
              platforms: { "windows-x86_64": nsis, "windows-x86_64-nsis": nsis, "windows-x86_64-msi": msi },
            };
            require("fs").writeFileSync("latest.json", JSON.stringify(latest, null, 2));
          '
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "OpenCut $VERSION" --latest \
              --notes "Instale o OpenCut pelo instalador (.exe) e a extensão do Claude (opencut.mcpb). Depois disso o app se atualiza sozinho."
          fi
          gh release upload "$TAG" "$EXE" "$EXE.sig" "$MSI" "$MSI.sig" mcp-server/opencut.mcpb latest.json --clobber
