[package]
name = "opencut-desktop"
version = "0.1.0"
edition = "2021"
description = "OpenCut desktop shell — native window around the local editor server"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "opencut-desktop"
path = "src/main.rs"
