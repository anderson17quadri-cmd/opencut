name: Build Windows desktop installer

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # better-sqlite3 is a native addon tied to one Node ABI; its postinstall
      # builds against whatever `node` is on PATH, so match the Node 22 we
      # bundle into the installer.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 1.3+ for --linker hoisted (see "Install workspace deps").
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: opencut-classic/apps/desktop-tauri/src-tauri -> target

      # Flat node_modules: with bun's isolated (symlinked) layout, Next's
      # standalone output links into a store outside the bundle and the
      # installed app fails with "Cannot find module 'next'".
      - name: Install workspace deps
        working-directory: opencut-classic
        run: bun install --linker hoisted

      - name: Install Tauri CLI
        working-directory: opencut-classic/apps/desktop-tauri
        run: bun install

      - name: Build web app (standalone output)
        working-directory: opencut-classic
        run: bun run build:web
        env:
          NODE_ENV: production
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:47821
          # Optional integrations stay unset — see apps/web/src/env/web.ts,
          # the app boots and runs fully without them.

      - name: Stage portable Node runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $index = Invoke-RestMethod -Uri "https://nodejs.org/dist/index.json"
          $latest22 = $index | Where-Object { $_.version -like "v22.*" } | Select-Object -First 1
          $nodeVersion = $latest22.version
          Write-Host "Staging portable Node $nodeVersion"
          $zipUrl = "https://nodejs.org/dist/$nodeVersion/node-$nodeVersion-win-x64.zip"
          Invoke-WebRequest -Uri $zipUrl -OutFile node.zip
          Expand-Archive -Path node.zip -DestinationPath node-extracted
          $extractedDir = Get-ChildItem node-extracted | Select-Object -First 1
          $dest = "opencut-classic/apps/desktop-tauri/src-tauri/resources/node"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item -Path "$($extractedDir.FullName)\*" -Destination $dest -Recurse -Force

      - name: Stage standalone server bundle
        working-directory: opencut-classic
        run: node apps/desktop-tauri/scripts/stage-server.mjs

      - name: Generate app icons
        working-directory: opencut-classic/apps/desktop-tauri
        run: bunx tauri icon ../web/public/icons/apple-icon-180x180.png

      - name: Build installer
        working-directory: opencut-classic/apps/desktop-tauri
        run: bunx tauri build

      - name: Locate installers
        id: artifacts
        shell: pwsh
        run: |
          $bundleDir = "opencut-classic/apps/desktop-tauri/src-tauri/target/release/bundle"
          Get-ChildItem -Path $bundleDir -Recurse -Include *.msi, *.exe | ForEach-Object {
            Write-Host "Built: $($_.FullName)"
          }
          echo "bundle_dir=$bundleDir" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: opencut-windows-installer
          path: |
            ${{ steps.artifacts.outputs.bundle_dir }}/msi/*.msi
            ${{ steps.artifacts.outputs.bundle_dir }}/nsis/*.exe
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.artifacts.outputs.bundle_dir }}/msi/*.msi
            ${{ steps.artifacts.outputs.bundle_dir }}/nsis/*.exe
