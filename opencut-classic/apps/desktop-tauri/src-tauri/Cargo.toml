[package]
name = "opencut-desktop"
version = "0.7.0"
edition = "2021"
description = "OpenCut desktop shell — native window around the local editor server"

# Standalone workspace: the repo root has its own [workspace] for the
# editor's Rust/wasm crates (rust/crates/*, apps/desktop) with its own
# dependency graph. This crate doesn't belong there — declaring an empty
# [workspace] here detaches it instead of erroring as an orphaned member.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dunce = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
	"Win32_UI_WindowsAndMessaging",
] }

[[bin]]
name = "opencut-desktop"
path = "src/main.rs"
